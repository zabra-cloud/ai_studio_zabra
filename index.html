<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나에게 맞는 직무 유형 테스트</title>
    <meta
      name="description"
      content="동아리 활동 12가지 질문으로 알아보는 나에게 맞는 직무 유형 테스트"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-page: #f5f2ff;
        --text-main: #0f172a;
        --text-sub: #475569;
        --text-muted: #64748b;
        --accent: #7c3aed;
        --accent-hover: #6d28d9;
        --accent-soft: #ede9fe;
        --card-bg: #ffffff;
        --radius-card: 24px;
        --radius-btn: 16px;
        --shadow-card: 0 8px 30px rgba(124, 58, 237, 0.08);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        transition: background-color 0.3s ease;
      }

      .font-display {
        font-family: 'Jua', 'Noto Sans KR', sans-serif;
      }

      .app-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(124, 58, 237, 0.12);
      }

      .topbar-inner {
        max-width: 1024px;
        margin: 0 auto;
        padding: 0 16px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand-btn {
        background: none;
        border: none;
        padding: 8px 4px;
        min-height: 48px;
        font-family: 'Jua', 'Noto Sans KR', sans-serif;
        font-size: 22px;
        color: #0f172a;
        cursor: pointer;
        white-space: nowrap;
      }

      .brand-btn:hover {
        color: #7c3aed;
      }

      .home-btn {
        background: none;
        border: none;
        padding: 8px 12px;
        min-height: 48px;
        font-size: 16px;
        font-weight: 600;
        color: #6d28d9;
        cursor: pointer;
        white-space: nowrap;
        border-radius: 10px;
      }

      .home-btn:hover {
        background: #f5f3ff;
      }

      .main-stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 20px 16px 32px;
      }

      .container {
        width: 100%;
        max-width: 1024px;
        margin: 0 auto;
      }

      .container-narrow {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
      }

      .footer {
        padding: 18px 16px;
        text-align: center;
        font-size: 15px;
        color: #7c3aed;
        opacity: 0.75;
      }

      /* Start Screen */
      .start-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        align-items: center;
      }

      @media (min-width: 960px) {
        .start-grid {
          grid-template-columns: 1fr 1fr;
          gap: 44px;
        }
        .start-visual {
          order: 2;
        }
        .start-copy {
          order: 1;
          align-items: flex-start;
          text-align: left;
        }
      }

      .start-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      @media (min-width: 960px) {
        .start-copy {
          align-items: flex-start;
          text-align: left;
        }
      }

      .kicker {
        font-size: 16px;
        font-weight: 700;
        color: #7c3aed;
        margin: 0 0 12px;
      }

      .hero-title {
        font-family: 'Jua', 'Noto Sans KR', sans-serif;
        font-size: clamp(2.3rem, 5vw, 3.1rem);
        line-height: 1.2;
        margin: 0 0 16px;
        text-wrap: balance;
      }

      .hero-desc {
        font-size: 18px;
        line-height: 1.7;
        color: var(--text-sub);
        max-width: 440px;
        margin: 0 0 28px;
      }

      .card {
        background: var(--card-bg);
        border-radius: var(--radius-card);
        padding: 24px;
        box-shadow: var(--shadow-card);
      }

      @media (min-width: 640px) {
        .card {
          padding: 36px;
        }
      }

      .btn-primary {
        width: 100%;
        min-height: 64px;
        padding: 16px 28px;
        border: none;
        border-radius: var(--radius-btn);
        background: #7c3aed;
        color: #ffffff;
        font-family: inherit;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 10px 24px rgba(124, 58, 237, 0.25);
        transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.16s ease;
        white-space: nowrap;
      }

      @media (min-width: 640px) {
        .start-btn {
          width: auto;
          min-width: 240px;
        }
      }

      .btn-primary:hover {
        background: #6d28d9;
        transform: scale(1.015);
      }

      .btn-primary:active {
        transform: scale(0.96);
      }

      .hint-text {
        margin: 14px 0 0;
        font-size: 15px;
        color: var(--text-muted);
      }

      /* Question Screen */
      .progress-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        min-height: 48px;
      }

      .back-btn {
        background: none;
        border: none;
        min-height: 48px;
        padding: 8px 12px 8px 0;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        color: #475569;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .back-btn:hover {
        color: #6d28d9;
      }

      .progress-count {
        font-size: 18px;
        font-weight: 700;
        color: #7c3aed;
        font-variant-numeric: tabular-nums;
      }

      .progress-track {
        width: 100%;
        height: 14px;
        background: #ddd6fe;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 24px;
      }

      .progress-fill {
        height: 100%;
        width: 100%;
        background: #7c3aed;
        border-radius: 999px;
        transform-origin: left;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .q-situation {
        font-size: 16px;
        font-weight: 600;
        color: #7c3aed;
        margin: 0 0 12px;
        font-variant-numeric: tabular-nums;
      }

      .q-title {
        font-size: 23px;
        line-height: 1.45;
        font-weight: 700;
        margin: 0 0 28px;
        text-wrap: balance;
      }

      @media (min-width: 640px) {
        .q-title {
          font-size: 26px;
        }
      }

      .options-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .option-btn {
        width: 100%;
        min-height: 96px;
        padding: 18px 20px;
        border-radius: 18px;
        border: 2px solid #ede9fe;
        background: #faf8ff;
        color: #1e293b;
        font-family: inherit;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.55;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
      }

      .option-btn:hover {
        background: #f3efff;
        border-color: #c4b5fd;
      }

      .option-btn.selected {
        background: #ede9fe;
        border-color: #7c3aed;
        color: #0f172a;
      }

      .option-badge {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: #ffffff;
        color: #7c3aed;
        font-family: 'Jua', sans-serif;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
      }

      .option-btn.selected .option-badge {
        background: #7c3aed;
        color: #ffffff;
      }

      @keyframes popBounce {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(0.94);
        }
        70% {
          transform: scale(1.045);
        }
        100% {
          transform: scale(1);
        }
      }

      .bouncing {
        animation: popBounce 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .enter-anim {
        animation: fadeSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .bouncing,
        .enter-anim {
          animation: none !important;
        }
        .progress-fill,
        .btn-primary,
        .option-btn {
          transition: none !important;
        }
      }

      /* Result Screen */
      .result-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      @media (min-width: 960px) {
        .result-grid {
          grid-template-columns: 5fr 7fr;
          align-items: stretch;
        }
      }

      .result-left {
        border-radius: var(--radius-card);
        padding: 28px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow-card);
      }

      .mascot-frame {
        width: 184px;
        height: 184px;
        border-radius: 24px;
        background: #ffffff;
        padding: 16px;
        margin: 16px 0 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      }

      .result-type-title {
        font-size: clamp(2.6rem, 6vw, 3.6rem);
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }

      .result-nickname {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 20px;
      }

      .score-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .score-tile {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        padding: 10px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .score-tile.top {
        color: #ffffff;
      }

      .section-heading {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px;
      }

      .desc-lines {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 17px;
        line-height: 1.65;
        color: #334155;
      }

      .desc-lines p {
        margin: 0;
      }

      .divider {
        height: 1px;
        background: #f1f5f9;
        margin: 24px 0;
      }

      .rec-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .rec-item {
        border-radius: 16px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      @media (min-width: 640px) {
        .rec-item {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
        }
      }

      .synergy-card {
        margin-top: 24px;
      }

      .synergy-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 768px) {
        .synergy-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .synergy-item {
        border-radius: 18px;
        padding: 20px;
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }

      .synergy-icon {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        background: #ffffff;
        padding: 8px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .actions-row {
        margin-top: 24px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 640px) {
        .actions-row {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .action-btn {
        min-height: 62px;
        padding: 14px 20px;
        border: none;
        border-radius: 18px;
        font-family: inherit;
        font-size: 19px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        transition: transform 0.16s ease, opacity 0.16s ease;
      }

      .action-btn:active {
        transform: scale(0.96);
      }

      .feedback-banner {
        margin-top: 12px;
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 500;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <button type="button" id="brandBtn" class="brand-btn">
            나에게 맞는 직무 유형 테스트
          </button>
          <button
            type="button"
            id="homeBtn"
            class="home-btn"
            style="display: none"
          >
            처음으로
          </button>
        </div>
      </header>

      <main id="mainStage" class="main-stage"></main>

      <footer class="footer">대학생을 위한 12문항 직무 유형 테스트</footer>
    </div>

          state.screen = 'result';
          state.resultType = typeParam;

        const url = new URL(window.location.href);
        if (url.searchParams.has('type')) {
          url.searchParams.delete('type');
          window.history.replaceState({}, '', url.toString());
        }
      }

      function calculateResult() {
        const scores = { PM: 0, DEV: 0, DESIGN: 0, DATA: 0 };
        Object.values(state.answers).forEach((career) => {
          scores[career] += 1;
        });
        const order = ['PM', 'DEV', 'DESIGN', 'DATA'];
        let max = -1;
        let topType = 'PM';
        for (const t of order) {
          if (scores[t] > max) {
            max = scores[t];
            topType = t;
          }
        }
        const tied = order.filter((t) => scores[t] === max);
        if (tied.length > 1) {
          for (let i = QUESTIONS.length; i >= 1; i -= 1) {
            if (tied.includes(state.answers[i])) {
              topType = state.answers[i];
              break;
            }
          }
        }
        state.resultType = topType;
        state.scores = scores;
      }

                <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
                  <p style="margin:0;font-size:16px;font-weight:700;color:${p.accent};">
                    ${state.isShared ? '친구가 공유한 직무 유형' : '나의 일하는 스타일 결과'}
                  </p>
                  <div class="mascot-frame">${p.svg}</div>
                  <h1 class="result-type-title" style="color:${p.accent};">${p.title}</h1>
                  <p class="result-nickname">“${p.nickname}”</p>
                </div>
                ${
                  state.scores
                    ? `<div class="score-grid">
                        ${scoreOrder
                          .map((item) => {
                            const isTop = item.type === p.type;
                            return `
                              <div class="score-tile ${isTop ? 'top' : ''}" style="${
                              isTop ? `background:${p.btnPrimary};` : ''
                            }">
                                <span style="font-size:13px;font-weight:600;">${item.label}</span>
                                <span style="font-size:18px;font-weight:900;margin-top:2px;">${state.scores[item.type]}</span>
                              </div>
                            `;
                          })
                          .join('')}
                      </div>`
                    : `<p style="font-size:15px;font-weight:600;color:${p.accent};margin:0;">어울리는 직무 · ${p.relatedJobs.join(' · ')}</p>`
                }
              </div>

              <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;gap:24px;">
                <div>
                  <h2 class="section-heading">나의 일하는 스타일은?</h2>
                  <div class="desc-lines">
                    ${p.description.map((line) => `<p>${line}</p>`).join('')}
                  </div>
                  <p style="margin:14px 0 0;font-size:16px;font-weight:600;color:${p.accent};">
                    어울리는 직무: ${p.relatedJobs.join(' · ')}
                  </p>
                  <div class="divider"></div>
                  <h2 class="section-heading">추천 자격증 · 과목 3가지</h2>
                  <div class="rec-list">
                    ${p.recommendations
                      .map(
                        (rec, idx) => `
                      <div class="rec-item" style="background:${p.softBg};">
                        <div style="display:flex;align-items:baseline;gap:10px;">
                          <span style="font-weight:900;color:${p.accent};">0${idx + 1}</span>
                          <span style="font-size:17px;font-weight:700;">${rec.title}</span>
                        </div>
                        <span style="font-size:15px;color:#475569;">${rec.category} · ${rec.detail}</span>
                      </div>
                    `
                      )
                      .join('')}
                  </div>
                </div>
              </div>
            </div>

            <div class="card synergy-card">
              <h2 class="section-heading">함께 일하면 시너지가 좋은 직무 유형 2가지</h2>
              <div class="synergy-grid">
                ${p.synergy
                  .map((s) => {
                    const target = PROFILES[s.type];
                    return `
                      <div class="synergy-item" style="background:${target.softBg};">
                        <div class="synergy-icon">${target.svg.replace('width="120" height="120"', 'width="52" height="52"')}</div>
                        <div>
                          <div style="font-size:21px;font-weight:900;color:${target.accent};">${target.title}</div>
                          <div style="font-size:15px;font-weight:700;margin:2px 0 8px;">“${target.nickname}”</div>
                          <div style="font-size:15px;line-height:1.55;color:#334155;">${s.reason}</div>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>

            <div class="actions-row">
              <button
                type="button"
                id="shareBtn"
                class="action-btn"
                style="background:${p.btnPrimary};color:#ffffff;"
              >
                공유하기
              </button>
              <button
                type="button"
                id="pngBtn"
                class="action-btn"
                style="background:#0f172a;color:#ffffff;"
              >
                PNG 저장
              </button>
              <button
                type="button"
                id="restartBtn"
                class="action-btn"
                style="background:${p.btnSecondaryBg};color:${p.btnSecondaryText};"
              >
                ${state.isShared ? '나도 테스트 하기' : '다시 하기'}
              </button>
            </div>
            <div id="feedbackBox"></div>
          </section>
        `;

        const showFeedback = (msg) => {
          const box = document.getElementById('feedbackBox');
          if (!box) return;
          box.innerHTML = `<div class="feedback-banner" style="background:${p.softBg};color:${p.accent};">${msg}</div>`;
          window.setTimeout(() => {
            if (box) box.innerHTML = '';
          }, 3500);
        };

        document.getElementById('shareBtn').addEventListener('click', async () => {
          const shareUrl = new URL(window.location.href);
          shareUrl.searchParams.set('type', p.type);
          const text = [
            `[나에게 맞는 직무 유형 테스트 결과]`,
            `나의 유형: ${p.title} — "${p.nickname}"`,
            '',
            ...p.description.map((d) => `• ${d}`),
            '',
            `추천 자격증·과목: ${p.recommendations.map((r) => r.title).join(', ')}`,
            `시너지 직무: ${p.synergy.map((s) => PROFILES[s.type].title).join(', ')}`,
            `링크: ${shareUrl.toString()}`,
          ].join('\n');

          try {
            await navigator.clipboard.writeText(text);
            showFeedback('결과 텍스트가 클립보드에 복사되었어요!');
          } catch {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showFeedback('결과 텍스트가 클립보드에 복사되었어요!');
          }
        });

        document.getElementById('pngBtn').addEventListener('click', () => {
          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1380;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const drawWrapped = (text, x, startY, maxWidth, lineHeight) => {
            const words = text.split(' ');
            let cur = '';
            let curY = startY;
            words.forEach((w) => {
              const next = cur ? `${cur} ${w}` : w;
              if (ctx.measureText(next).width > maxWidth && cur) {
                ctx.fillText(cur, x, curY);
                curY += lineHeight;
                cur = w;
              } else {
                cur = next;
              }
            });
            if (cur) {
              ctx.fillText(cur, x, curY);
              curY += lineHeight;
            }
            return curY;
          };

          ctx.fillStyle = p.pageBg;
          ctx.fillRect(0, 0, 1080, 1380);

          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          if (typeof ctx.roundRect === 'function') {
            ctx.roundRect(64, 64, 952, 1252, 40);
          } else {
            ctx.rect(64, 64, 952, 1252);
          }
          ctx.fill();

          ctx.textAlign = 'center';
          ctx.fillStyle = p.accent;
          ctx.font = '900 72px "Noto Sans KR", sans-serif';
          ctx.fillText(p.title, 540, 200);

          ctx.fillStyle = '#0F172A';
          ctx.font = '700 34px "Noto Sans KR", sans-serif';
          ctx.fillText(`“${p.nickname}”`, 540, 265);

          ctx.textAlign = 'left';
          ctx.fillStyle = '#334155';
          ctx.font = '400 26px "Noto Sans KR", sans-serif';
          let y = 355;
          p.description.forEach((line) => {
            y = drawWrapped(`• ${line}`, 124, y, 820, 40) + 10;
          });

          y += 20;
          ctx.fillStyle = '#0F172A';
          ctx.font = '700 28px "Noto Sans KR", sans-serif';
          ctx.fillText('추천 자격증 · 과목 3가지', 124, y);
          y += 44;
          p.recommendations.forEach((r) => {
            ctx.fillStyle = p.accent;
            ctx.font = '700 25px "Noto Sans KR", sans-serif';
            y = drawWrapped(`• ${r.title} (${r.category})`, 124, y, 820, 38) + 4;
          });

          y += 22;
          ctx.fillStyle = '#0F172A';
          ctx.font = '700 28px "Noto Sans KR", sans-serif';
          ctx.fillText('함께 일하면 시너지 좋은 직무 유형 2가지', 124, y);
          y += 44;
          p.synergy.forEach((s) => {
            const t = PROFILES[s.type];
            ctx.fillStyle = p.accent;
            ctx.font = '700 24px "Noto Sans KR", sans-serif';
            y = drawWrapped(`• ${t.title} — ${s.reason}`, 124, y, 820, 36) + 8;
          });

          ctx.textAlign = 'center';
          ctx.fillStyle = '#94A3B8';
          ctx.font = '500 24px "Noto Sans KR", sans-serif';
          ctx.fillText('나에게 맞는 직무 유형 테스트', 540, 1272);

          const link = document.createElement('a');
          link.download = `직무유형_${p.title.replace(/\s+/g, '_')}_결과.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          showFeedback('결과 이미지가 PNG로 저장되었어요!');
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
          clearSharedQuery();
          state.screen = 'quiz';
          state.index = 0;
          state.answers = {};
          state.scores = null;
          state.isShared = false;
          render();
        });
      }

      function render() {
        if (state.screen === 'start') renderStart();
        else if (state.screen === 'quiz') renderQuiz();
        else renderResult();
      }

      function goHome() {
        clearSharedQuery();
        state.screen = 'start';
        state.index = 0;
        state.answers = {};
        state.scores = null;
        state.isShared = false;
        render();
      }

      brandBtn.addEventListener('click', goHome);
      homeBtn.addEventListener('click', goHome);

      checkSharedQuery();
      render();
    </script>
  </body>
</html>
